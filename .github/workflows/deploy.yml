name: Deploy Client

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-client
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build
        env:
          # Same-origin: nginx on the VPS serves this build and proxies /api
          # to gnp-server, so a relative path works with no domain needed.
          VITE_API_URL: /api

      - name: Sync build to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: /opt/gnp-client/dist/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_port: ${{ secrets.SSH_PORT || 22 }}
