name: Deploy Client

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-client
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/opengnp/gnp-client

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Same-origin: nginx (baked into this image) serves the build and
          # proxies /api to gnp-server over the Docker network, so a relative
          # path works with no domain needed.
          build-args: |
            VITE_API_URL=/api
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Deploy
        run: |
          set -e
          cd /home/deploy/gnp
          docker compose pull gnp-client
          docker compose up -d gnp-client