# Baked into the gnp-client image at /etc/nginx/conf.d/default.conf (see ../Dockerfile).
# Serves the built app and reverse-proxies the API + docs to the gnp-server
# container over the Docker Compose network (resolved by service name — see
# ../../gnp-server/deploy/docker-compose.yml). No domain yet: plain :80 for the
# VPS's IP. Add server_name and TLS later if/when a domain is pointed at this box.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://gnp-server:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://gnp-server:3000/docs;
        proxy_set_header Host $host;
    }

    # SPA fallback: unknown paths resolve to index.html for client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
